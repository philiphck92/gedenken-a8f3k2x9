<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In liebevoller Erinnerung</title>
<style>
  :root {
    --bg: #1a1a1a;
    --text: #f2f0eb;
    --accent: #c9a961;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .header {
    text-align: center;
    margin-bottom: 30px;
  }

  .name {
    font-size: 2.2rem;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .dates {
    font-size: 1.1rem;
    color: var(--accent);
    letter-spacing: 2px;
  }

  .slideshow-container {
    position: relative;
    width: 100%;
    max-width: 700px;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .slideshow-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    display: none;
    animation: fade 1.2s ease;
  }

  .slideshow-container img.active {
    display: block;
  }

  @keyframes fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .caption {
    text-align: center;
    margin-top: 16px;
    font-style: italic;
    color: #ccc;
    min-height: 1.4em;
  }

  .controls {
    display: flex;
    gap: 20px;
    margin-top: 20px;
    align-items: center;
  }

  .controls button {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.9rem;
    font-family: inherit;
  }

  .controls button:hover {
    background: var(--accent);
    color: #1a1a1a;
  }

  .dots {
    display: flex;
    gap: 6px;
    margin-top: 16px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #555;
    transition: background 0.3s;
  }

  .dot.active {
    background: var(--accent);
  }

  .footer-text {
    margin-top: 36px;
    font-size: 0.9rem;
    color: #888;
    text-align: center;
    max-width: 500px;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="name">Josef Hacker</div>
    <div class="dates">1957 – 2026</div>
  </div>

  <div class="slideshow-container" id="slideshowContainer">
    <!-- Bilder werden per JavaScript eingefügt -->
  </div>

  <div class="caption" id="caption"></div>

  <div class="controls">
    <button onclick="prevSlide()">&larr; Zurück</button>
    <button onclick="togglePlay()" id="playBtn">Pause</button>
    <button onclick="nextSlide()">Weiter &rarr;</button>
  </div>

  <div class="dots" id="dots"></div>

  <div class="footer-text">
    In liebevoller Erinnerung an schöne gemeinsame Momente.
  </div>

<script>
  // ============================================
  // Fotos werden automatisch aus dem Ordner "fotos/"
  // geladen: ALLE Dateien mit Endung .jpg/.jpeg,
  // unabhängig vom Dateinamen, alphabetisch sortiert.
  // Einfach neue Fotos in den Ordner legen - keine
  // manuelle Listenpflege nötig. Bildunterschriften
  // können unten in captions["dateiname.jpeg"]
  // ergänzt werden.
  // ============================================
  const REPO_OWNER = "philiphck92";
  const REPO_NAME = "gedenken-a8f3k2x9";
  const PHOTOS_PATH = "fotos";

  const captions = {
    // "foto1.jpeg": "Ein schöner Tag am See"
  };

  const maxPhotos = 200;        // obere Grenze für die Fallback-Suche
  const maxConsecutiveMisses = 5; // Fallback-Suche stoppt nach so vielen Lücken in Folge

  const intervalSeconds = 5; // Sekunden pro Foto
  // ============================================

  const container = document.getElementById('slideshowContainer');
  const captionEl = document.getElementById('caption');
  const dotsEl = document.getElementById('dots');
  const playBtn = document.getElementById('playBtn');

  let slides = [];
  let current = 0;
  let playing = true;
  let timer;

  function isJpeg(name) {
    return /\.jpe?g$/i.test(name);
  }

  // Primäre Methode: Ordnerinhalt per GitHub-API abfragen.
  // Findet JEDE .jpg/.jpeg-Datei, egal wie sie heißt.
  async function discoverSlidesViaGitHub() {
    const url = "https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/contents/" + PHOTOS_PATH;
    const res = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
    if (!res.ok) throw new Error("GitHub API Fehler: " + res.status);
    const items = await res.json();
    const names = items
      .filter((item) => item.type === "file" && isJpeg(item.name))
      .map((item) => item.name)
      .sort((a, b) => a.localeCompare(b, "de", { sensitivity: "base", numeric: true }));
    if (names.length === 0) throw new Error("Keine JPEGs über GitHub-API gefunden");
    return names.map((name) => ({
      src: PHOTOS_PATH + "/" + encodeURIComponent(name),
      caption: captions[name] || ""
    }));
  }

  function checkPhoto(src) {
    // Nur Header abfragen (HEAD), damit für die reine
    // Existenzprüfung nicht das ganze Foto heruntergeladen wird.
    return fetch(src, { method: "HEAD", cache: "no-store" })
      .then((res) => res.ok)
      .catch(() => false);
  }

  // Fallback, falls die GitHub-API nicht erreichbar ist:
  // probiert fotoN.jpeg der Reihe nach durch.
  async function discoverSlidesByProbing() {
    const found = [];
    let misses = 0;
    for (let i = 1; i <= maxPhotos && misses < maxConsecutiveMisses; i++) {
      const name = "foto" + i + ".jpeg";
      const src = PHOTOS_PATH + "/" + name;
      const ok = await checkPhoto(src);
      if (ok) {
        found.push({ src, caption: captions[name] || "" });
        misses = 0;
      } else {
        misses++;
      }
    }
    return found;
  }

  async function discoverSlides() {
    try {
      return await discoverSlidesViaGitHub();
    } catch (err) {
      console.warn("Foto-Erkennung über GitHub-API fehlgeschlagen, nutze Fallback:", err);
      return discoverSlidesByProbing();
    }
  }

  function renderSlides() {
    slides.forEach((slide, i) => {
      const img = document.createElement('img');
      img.dataset.src = slide.src;
      img.alt = "Erinnerungsfoto " + (i + 1);
      img.decoding = "async";
      if (i === 0) img.classList.add('active');
      container.appendChild(img);

      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (i === 0) dot.classList.add('active');
      dotsEl.appendChild(dot);
    });
  }

  // Lädt ein Foto erst, wenn es tatsächlich gebraucht wird
  // (aktuelles Bild bzw. Vorschau des nächsten), statt alle
  // Fotos sofort beim Seitenaufruf herunterzuladen.
  function loadSlide(index) {
    const imgs = container.querySelectorAll('img');
    const img = imgs[index];
    if (img && img.dataset.src) {
      img.src = img.dataset.src;
      delete img.dataset.src;
    }
  }

  function showSlide(index) {
    const imgs = container.querySelectorAll('img');
    const dots = dotsEl.querySelectorAll('.dot');
    imgs[current].classList.remove('active');
    dots[current].classList.remove('active');
    current = (index + slides.length) % slides.length;
    loadSlide(current);
    loadSlide((current + 1) % slides.length);
    imgs[current].classList.add('active');
    dots[current].classList.add('active');
    captionEl.textContent = slides[current].caption || "";
  }

  function nextSlide() {
    showSlide(current + 1);
    resetTimer();
  }

  function prevSlide() {
    showSlide(current - 1);
    resetTimer();
  }

  function startTimer() {
    if (slides.length < 2) return;
    timer = setInterval(() => showSlide(current + 1), intervalSeconds * 1000);
  }

  function resetTimer() {
    clearInterval(timer);
    if (playing) startTimer();
  }

  function togglePlay() {
    playing = !playing;
    playBtn.textContent = playing ? "Pause" : "Abspielen";
    if (playing) {
      startTimer();
    } else {
      clearInterval(timer);
    }
  }

  discoverSlides().then((found) => {
    slides = found;
    if (slides.length === 0) {
      captionEl.textContent = "Keine Fotos gefunden.";
      return;
    }
    renderSlides();
    loadSlide(0);
    if (slides.length > 1) loadSlide(1);
    captionEl.textContent = slides[0].caption || "";
    startTimer();
  });
</script>

</body>
</html>
