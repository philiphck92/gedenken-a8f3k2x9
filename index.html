<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In liebevoller Erinnerung</title>
<style>
  :root {
    --bg: #1a1a1a;
    --text: #f2f0eb;
    --accent: #c9a961;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .header {
    text-align: center;
    margin-bottom: 30px;
  }

  .name {
    font-size: 2.2rem;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .dates {
    font-size: 1.1rem;
    color: var(--accent);
    letter-spacing: 2px;
  }

  .slideshow-container {
    position: relative;
    width: 100%;
    max-width: 700px;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .slideshow-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    display: none;
    animation: fade 1.2s ease;
  }

  .slideshow-container img.active {
    display: block;
  }

  @keyframes fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .caption {
    text-align: center;
    margin-top: 16px;
    font-style: italic;
    color: #ccc;
    min-height: 1.4em;
  }

  .controls {
    display: flex;
    gap: 20px;
    margin-top: 20px;
    align-items: center;
  }

  .controls button {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.9rem;
    font-family: inherit;
  }

  .controls button:hover {
    background: var(--accent);
    color: #1a1a1a;
  }

  .dots {
    display: flex;
    gap: 6px;
    margin-top: 16px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #555;
    transition: background 0.3s;
  }

  .dot.active {
    background: var(--accent);
  }

  .footer-text {
    margin-top: 36px;
    font-size: 0.9rem;
    color: #888;
    text-align: center;
    max-width: 500px;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="name">Josef Hacker</div>
    <div class="dates">1957 – 2026</div>
  </div>

  <div class="slideshow-container" id="slideshowContainer">
    <!-- Bilder werden per JavaScript eingefügt -->
  </div>

  <div class="caption" id="caption"></div>

  <div class="controls">
    <button onclick="prevSlide()">&larr; Zurück</button>
    <button onclick="togglePlay()" id="playBtn">Pause</button>
    <button onclick="nextSlide()">Weiter &rarr;</button>
  </div>

  <div class="dots" id="dots"></div>

  <div class="footer-text">
    In liebevoller Erinnerung an schöne gemeinsame Momente.
  </div>

<script>
  // ============================================
  // HIER ANPASSEN: Fotos und Bildunterschriften
  // Dateien müssen im gleichen Ordner wie diese
  // HTML-Datei liegen (z.B. in einem Unterordner "fotos/")
  // ============================================
  const slides = [
    { src: "fotos/foto1.jpeg", caption: "" },
    { src: "fotos/foto2.jpeg", caption: "" },
    { src: "fotos/foto3.jpeg", caption: "" },
    { src: "fotos/foto4.jpeg", caption: "" },
    { src: "fotos/foto5.jpeg", caption: "" },
    { src: "fotos/foto6.jpeg", caption: "" },
    { src: "fotos/foto7.jpeg", caption: "" },
    { src: "fotos/foto8.jpeg", caption: "" },
    { src: "fotos/foto9.jpeg", caption: "" }
  ];

  const intervalSeconds = 5; // Sekunden pro Foto
  // ============================================

  const container = document.getElementById('slideshowContainer');
  const captionEl = document.getElementById('caption');
  const dotsEl = document.getElementById('dots');
  const playBtn = document.getElementById('playBtn');

  let current = 0;
  let playing = true;
  let timer;

  slides.forEach((slide, i) => {
    const img = document.createElement('img');
    img.src = slide.src;
    img.alt = "Erinnerungsfoto " + (i + 1);
    if (i === 0) img.classList.add('active');
    container.appendChild(img);

    const dot = document.createElement('div');
    dot.classList.add('dot');
    if (i === 0) dot.classList.add('active');
    dotsEl.appendChild(dot);
  });

  const imgs = container.querySelectorAll('img');
  const dots = dotsEl.querySelectorAll('.dot');

  function showSlide(index) {
    imgs[current].classList.remove('active');
    dots[current].classList.remove('active');
    current = (index + slides.length) % slides.length;
    imgs[current].classList.add('active');
    dots[current].classList.add('active');
    captionEl.textContent = slides[current].caption || "";
  }

  function nextSlide() {
    showSlide(current + 1);
    resetTimer();
  }

  function prevSlide() {
    showSlide(current - 1);
    resetTimer();
  }

  function startTimer() {
    timer = setInterval(() => showSlide(current + 1), intervalSeconds * 1000);
  }

  function resetTimer() {
    clearInterval(timer);
    if (playing) startTimer();
  }

  function togglePlay() {
    playing = !playing;
    playBtn.textContent = playing ? "Pause" : "Abspielen";
    if (playing) {
      startTimer();
    } else {
      clearInterval(timer);
    }
  }

  captionEl.textContent = slides[0].caption || "";
  startTimer();
</script>

</body>
</html>
